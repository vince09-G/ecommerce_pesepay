<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            My Store
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}
    {% endblock %}

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'products_page' %}"
        >
            My Store
        </a>


        <div class="d-flex align-items-center gap-2">

            <a
                href="{% url 'products_page' %}"
                class="btn btn-outline-light"
            >
                Products
            </a>


            <a
                href="{% url 'cart_page' %}"
                class="btn btn-outline-light"
            >
                🛒 Cart
            </a>


            <span
                id="auth-links"
                class="d-flex gap-2"
            >
            </span>

        </div>

    </div>

</nav>


<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

{% block content %}
{% endblock %}


<!-- =====================================================
     AUTHENTICATION JAVASCRIPT
     ===================================================== -->

<script>

function getAccessToken() {

    return localStorage.getItem(
        "access_token"
    );

}


/* =====================================================
   UPDATE NAVBAR
   ===================================================== */

function updateNavbar() {

    const authLinks =
        document.getElementById(
            "auth-links"
        );


    if (!authLinks) {

        return;

    }


    const token =
        getAccessToken();


    if (token) {

        authLinks.innerHTML = `

            <button
                class="btn btn-outline-warning"
                onclick="logout()"
            >
                Logout
            </button>

        `;

    }

    else {

        authLinks.innerHTML = `

            <a
                href="{% url 'login' %}"
                class="btn btn-outline-light"
            >
                Login
            </a>


            <a
                href="{% url 'register' %}"
                class="btn btn-primary"
            >
                Register
            </a>

        `;

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

    localStorage.removeItem(
        "access_token"
    );


    localStorage.removeItem(
        "refresh_token"
    );


    localStorage.removeItem(
        "cart_id"
    );


    window.location.href =
        "{% url 'products_page' %}";

}


/* =====================================================
   START
   ===================================================== */

updateNavbar();

</script>


{% block extra_js %}
{% endblock %}


</body>

</html>
