{% extends "base.html" %}


{% block title %}
Products
{% endblock %}


{% block content %}

<div class="container mt-4">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <h2>
            Products
        </h2>


        <a
            href="{% url 'cart_page' %}"
            class="btn btn-outline-primary"
        >
            🛒 View Cart
        </a>

    </div>


    <!-- =================================================
         SEARCH AND SORT
         ================================================= -->

    <div class="row mb-3">

        <div class="col-md-6">

            <input
                type="text"
                id="search"
                class="form-control"
                placeholder="Search products"
            >

        </div>


        <div class="col-md-3">

            <select
                id="order"
                class="form-select"
            >

                <option value="">
                    Sort
                </option>

                <option value="price">
                    Price ↑
                </option>

                <option value="-price">
                    Price ↓
                </option>

            </select>

        </div>

    </div>


    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <div
        class="row"
        id="products"
    >

    </div>


    <!-- =================================================
         PAGINATION
         ================================================= -->

    <div
        class="d-flex justify-content-between mt-4"
    >

        <button
            class="btn btn-secondary"
            id="prevBtn"
        >
            Previous
        </button>


        <button
            class="btn btn-secondary"
            id="nextBtn"
        >
            Next
        </button>

    </div>


</div>


<script>

/* =====================================================
   VARIABLES
   ===================================================== */

let currentPage = 1;

let cartId =
    localStorage.getItem(
        "cart_id"
    );


/* =====================================================
   GET TOKEN
   ===================================================== */

function getAccessToken() {

    return localStorage.getItem(
        "access_token"
    );

}


/* =====================================================
   CREATE CART
   ===================================================== */

async function createCart() {

    const token =
        getAccessToken();


    /* ---------------------------------------------
       USER MUST BE LOGGED IN
       --------------------------------------------- */

    if (!token) {

        window.location.href =
            `/login/?next=${encodeURIComponent(
                window.location.pathname
            )}`;

        return null;

    }


    /* ---------------------------------------------
       CHECK EXISTING CART
       --------------------------------------------- */

    if (cartId) {

        const response =
            await fetch(
                `/api/store/carts/${cartId}/`,
                {
                    headers: {

                        "Authorization":
                            `JWT ${token}`

                    }
                }
            );


        if (response.ok) {

            return cartId;

        }


        localStorage.removeItem(
            "cart_id"
        );


        cartId = null;

    }


    /* ---------------------------------------------
       CREATE NEW CART
       --------------------------------------------- */

    const response =
        await fetch(
            "/api/store/carts/",
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `JWT ${token}`

                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Unable to create cart."
        );

    }


    const data =
        await response.json();


    cartId =
        data.id;


    localStorage.setItem(
        "cart_id",
        cartId
    );


    return cartId;

}


/* =====================================================
   ADD TO CART
   ===================================================== */

async function addToCart(
    productId
) {

    try {

        const cart =
            await createCart();


        if (!cart) {

            return;

        }


        const response =
            await fetch(
                `/api/store/carts/${cart}/cart-items/`,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `JWT ${getAccessToken()}`

                    },

                    body: JSON.stringify({

                        product_id:
                            productId,

                        quantity: 1

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to add product to cart."
            );

        }


        alert(
            "Product added to cart! ✅"
        );

    }


    catch (error) {

        console.error(error);

        alert(
            error.message
        );

    }

}


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts(
    search = "",
    order = "",
    page = 1
) {

    const url =
        `/api/store/products/` +
        `?search=${encodeURIComponent(search)}` +
        `&ordering=${order}` +
        `&page=${page}`;


    const response =
        await fetch(url);


    if (!response.ok) {

        alert(
            "Unable to load products."
        );

        return;

    }


    const data =
        await response.json();


    const container =
        document.getElementById(
            "products"
        );


    container.innerHTML = "";


    /* ---------------------------------------------
       NO PRODUCTS
       --------------------------------------------- */

    if (
        !data.results ||
        data.results.length === 0
    ) {

        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-info">

                    No products found.

                </div>

            </div>

        `;

    }


    /* ---------------------------------------------
       DISPLAY PRODUCTS
       --------------------------------------------- */

    data.results.forEach(
        function(product) {

            container.innerHTML += `

                <div class="col-md-4 mb-4">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h5 class="card-title">

                                ${product.title}

                            </h5>


                            <p class="card-text">

                                ${product.description}

                            </p>


                            <p>

                                <strong>

                                    $${product.price}

                                </strong>

                            </p>


                            <p class="text-muted">

                                Stock:
                                ${product.inventory}

                            </p>


                            <a
                                href="/product/${product.id}/"
                                class="btn btn-outline-secondary mb-2"
                            >
                                View Details
                            </a>


                            <button
                                class="btn btn-primary"
                                onclick="addToCart(${product.id})"
                            >
                                Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    /* ---------------------------------------------
       PAGINATION BUTTONS
       --------------------------------------------- */

    document.getElementById(
        "prevBtn"
    ).disabled =
        !data.previous;


    document.getElementById(
        "nextBtn"
    ).disabled =
        !data.next;

}


/* =====================================================
   SEARCH
   ===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "keyup",
        function() {

            currentPage = 1;


            loadProducts(

                this.value,

                document.getElementById(
                    "order"
                ).value,

                currentPage

            );

        }
    );


/* =====================================================
   SORT
   ===================================================== */

document
    .getElementById("order")
    .addEventListener(
        "change",
        function() {

            currentPage = 1;


            loadProducts(

                document.getElementById(
                    "search"
                ).value,

                this.value,

                currentPage

            );

        }
    );


/* =====================================================
   NEXT PAGE
   ===================================================== */

document
    .getElementById("nextBtn")
    .addEventListener(
        "click",
        function() {

            currentPage++;


            loadProducts(

                document.getElementById(
                    "search"
                ).value,

                document.getElementById(
                    "order"
                ).value,

                currentPage

            );

        }
    );


/* =====================================================
   PREVIOUS PAGE
   ===================================================== */

document
    .getElementById("prevBtn")
    .addEventListener(
        "click",
        function() {

            if (currentPage > 1) {

                currentPage--;


                loadProducts(

                    document.getElementById(
                        "search"
                    ).value,

                    document.getElementById(
                        "order"
                    ).value,

                    currentPage

                );

            }

        }
    );


/* =====================================================
   START
   ===================================================== */

loadProducts();

</script>

{% endblock %}
