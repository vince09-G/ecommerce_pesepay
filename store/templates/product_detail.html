
{% extends "base.html" %}

{% block title %}
Product Details
{% endblock %}


{% block extra_css %}

<style>

.product-image-container {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
}

.main-product-image {
    width: 100%;
    height: 420px;
    object-fit: contain;
    border-radius: 10px;
    background: #f8f9fa;
    display: block;
}

.product-thumbnail {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border: 2px solid #dee2e6;
    border-radius: 8px;
    padding: 4px;
    background: white;
    cursor: pointer;
    transition: border-color 0.2s ease;
}

.product-thumbnail:hover,
.product-thumbnail.active {
    border-color: #0d6efd;
}

.thumbnail-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.no-product-image {
    width: 100%;
    height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f8f9fa;
    color: #6c757d;
    border-radius: 10px;
    border: 1px dashed #ced4da;
}

.product-details-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
}

.product-description {
    white-space: pre-line;
    overflow-wrap: anywhere;
    color: #555;
    line-height: 1.7;
}

.product-price {
    font-size: 1.8rem;
    font-weight: bold;
    color: #198754;
}

#add-to-cart-btn {
    font-weight: 600;
}

@media (max-width: 767px) {

    .main-product-image,
    .no-product-image {
        height: 300px;
    }

    .product-details-card {
        padding: 20px;
    }

    .product-thumbnail {
        width: 65px;
        height: 65px;
    }

}

</style>

{% endblock %}


{% block content %}

<div class="container mt-5 mb-5">


    <!-- BACK BUTTON -->

    <a
        href="{% url 'products_page' %}"
        class="btn btn-outline-secondary mb-4"
    >
        ⬅ Back to Store
    </a>


    <!-- PRODUCT DETAILS -->

    <div class="row g-4">


        <!-- =========================================
             PRODUCT IMAGES
             ========================================= -->

        <div class="col-md-6">

            <div class="product-image-container">

                <!-- MAIN IMAGE -->

                <div id="main-image-container">

                    <div class="no-product-image">

                        <div class="spinner-border text-primary mb-3"
                             role="status">

                            <span class="visually-hidden">
                                Loading...
                            </span>

                        </div>

                        <p class="mb-0">
                            Loading product image...
                        </p>

                    </div>

                </div>


                <!-- IMAGE THUMBNAILS -->

                <div
                    id="thumbnail-container"
                    class="thumbnail-container"
                >
                </div>

            </div>

        </div>


        <!-- =========================================
             PRODUCT INFORMATION
             ========================================= -->

        <div class="col-md-6">

            <div class="product-details-card h-100">

                <h2
                    id="title"
                    class="fw-bold mb-3"
                >
                    Loading...
                </h2>


                <p
                    id="description"
                    class="product-description mb-4"
                >
                </p>


                <h4 class="product-price mb-3">

                    $<span id="price"></span>

                </h4>


                <p class="text-muted">

                    Stock:

                    <span
                        id="inventory"
                        class="fw-semibold"
                    >
                    </span>

                </p>


                <div
                    id="product-message"
                    class="mt-3"
                >
                </div>


                <button
                    class="btn btn-primary btn-lg mt-3"
                    id="add-to-cart-btn"
                    type="button"
                    disabled
                >
                    Add to Cart 🛒
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   PRODUCT ID
   ===================================================== */

const productId = {{ product_id }};


/* =====================================================
   GET TOKEN
   ===================================================== */

function getAccessToken() {

    return localStorage.getItem("access_token");

}


/* =====================================================
   IMAGE URL
   Supports absolute and relative image URLs.
   ===================================================== */

function getImageUrl(image) {

    if (!image) {
        return "";
    }

    // DRF ImageField values are normally URL strings.
    // Handle an object too, if a custom API returns one.

    const imageUrl =
        typeof image === "string"
            ? image
            : image.image;


    if (!imageUrl) {
        return "";
    }


    if (
        imageUrl.startsWith("http://") ||
        imageUrl.startsWith("https://")
    ) {
        return imageUrl;
    }


    return new URL(
        imageUrl,
        window.location.origin
    ).href;

}


/* =====================================================
   SHOW IMAGE PLACEHOLDER
   ===================================================== */

function showImagePlaceholder(message) {

    const container = document.getElementById(
        "main-image-container"
    );

    container.innerHTML = "";


    const placeholder = document.createElement("div");

    placeholder.className = "no-product-image";


    const icon = document.createElement("div");

    icon.className = "display-3 mb-3";

    icon.textContent = "🖼️";


    const text = document.createElement("p");

    text.className = "mb-0";

    text.textContent = message;


    placeholder.appendChild(icon);

    placeholder.appendChild(text);

    container.appendChild(placeholder);


    document.getElementById(
        "thumbnail-container"
    ).innerHTML = "";

}


/* =====================================================
   DISPLAY PRODUCT IMAGES
   ===================================================== */

function displayProductImages(images) {

    const mainContainer = document.getElementById(
        "main-image-container"
    );

    const thumbnailContainer = document.getElementById(
        "thumbnail-container"
    );


    mainContainer.innerHTML = "";

    thumbnailContainer.innerHTML = "";


    // No images available.

    if (!Array.isArray(images) || images.length === 0) {

        showImagePlaceholder(
            "No product images available"
        );

        return;

    }


    // Keep images that have a usable URL.

    const validImages = images
        .map(function(item) {

            return {
                id: item.id,
                url: getImageUrl(item.image)
            };

        })
        .filter(function(item) {

            return item.url;

        });


    if (validImages.length === 0) {

        showImagePlaceholder(
            "No product images available"
        );

        return;

    }


    // Display the selected image.

    function selectImage(selectedIndex) {

        const selectedImage = validImages[selectedIndex];

        mainContainer.innerHTML = "";


        const image = document.createElement("img");

        image.className = "main-product-image";

        image.src = selectedImage.url;

        image.alt = document.getElementById(
            "title"
        ).textContent;

        image.loading = "eager";


        image.onerror = function() {

            showImagePlaceholder(
                "Unable to load product image"
            );

        };


        mainContainer.appendChild(image);


        // Highlight the selected thumbnail.

        const thumbnails = thumbnailContainer.querySelectorAll(
            ".product-thumbnail"
        );


        thumbnails.forEach(function(thumbnail, index) {

            thumbnail.classList.toggle(
                "active",
                index === selectedIndex
            );

        });

    }


    // Create a thumbnail for each image.

    validImages.forEach(function(item, index) {

        const thumbnail = document.createElement("img");

        thumbnail.src = item.url;

        thumbnail.alt =
            "Product image " + (index + 1);

        thumbnail.className = "product-thumbnail";

        thumbnail.loading = "lazy";

        thumbnail.tabIndex = 0;

        thumbnail.setAttribute(
            "role",
            "button"
        );

        thumbnail.setAttribute(
            "aria-label",
            "View product image " + (index + 1)
        );


        thumbnail.onerror = function() {

            this.style.display = "none";

        };


        thumbnail.addEventListener("click", function() {

            selectImage(index);

        });


        thumbnail.addEventListener("keydown", function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                selectImage(index);

            }

        });


        thumbnailContainer.appendChild(thumbnail);

    });


    // Display the first image by default.

    selectImage(0);

}


/* =====================================================
   CREATE CART
   ===================================================== */

async function createCart() {

    const token = getAccessToken();


    if (!token) {

        window.location.href =
            `/login/?next=${encodeURIComponent(
                window.location.pathname
            )}`;

        return null;

    }


    let cartId = localStorage.getItem("cart_id");


    // CHECK EXISTING CART

    if (cartId) {

        const response = await fetch(
            `/api/store/carts/${cartId}/`,
            {
                headers: {

                    "Authorization": `JWT ${token}`

                }
            }
        );


        if (response.ok) {

            return cartId;

        }


        localStorage.removeItem("cart_id");

        cartId = null;

    }


    // CREATE NEW CART

    const response = await fetch(
        "/api/store/carts/",
        {
            method: "POST",

            headers: {

                "Content-Type": "application/json",

                "Authorization": `JWT ${token}`

            }
        }
    );


    if (!response.ok) {

        throw new Error(
            "Unable to create cart."
        );

    }


    const data = await response.json();


    localStorage.setItem(
        "cart_id",
        data.id
    );


    return data.id;

}


/* =====================================================
   ADD TO CART
   ===================================================== */

async function addToCart() {

    const button = document.getElementById(
        "add-to-cart-btn"
    );

    const message = document.getElementById(
        "product-message"
    );


    try {

        button.disabled = true;

        button.textContent = "Adding...";

        message.textContent = "";


        const cartId = await createCart();


        if (!cartId) {

            return;

        }


        const response = await fetch(
            `/api/store/carts/${cartId}/cart-items/`,
            {
                method: "POST",

                headers: {

                    "Content-Type": "application/json",

                    "Authorization": `JWT ${getAccessToken()}`

                },

                body: JSON.stringify({

                    product_id: productId,

                    quantity: 1

                })

            }
        );


        if (!response.ok) {

            throw new Error(
                "Unable to add product to cart."
            );

        }


        message.className = "alert alert-success mt-3";

        message.textContent =
            "Product added to cart successfully!";


    } catch (error) {

        console.error(error);

        message.className = "alert alert-danger mt-3";

        message.textContent = error.message;


    } finally {

        button.disabled = false;

        button.textContent = "Add to Cart 🛒";

    }

}


/* =====================================================
   LOAD PRODUCT
   ===================================================== */

async function loadProduct() {

    try {

        const response = await fetch(
            `/api/store/products/${productId}/`
        );


        if (!response.ok) {

            throw new Error(
                "Product not found."
            );

        }


        const product = await response.json();


        // PRODUCT INFORMATION

        document.getElementById(
            "title"
        ).textContent = product.title;


        document.getElementById(
            "description"
        ).textContent = product.description || "";


        document.getElementById(
            "price"
        ).textContent = Number(
            product.price
        ).toFixed(2);


        document.getElementById(
            "inventory"
        ).textContent = product.inventory;


        // PRODUCT IMAGES

        displayProductImages(product.images);


        // ENABLE ADD TO CART

        document.getElementById(
            "add-to-cart-btn"
        ).disabled = false;


    } catch (error) {

        console.error(
            "Error loading product:",
            error
        );


        document.getElementById(
            "title"
        ).textContent = error.message;


        document.getElementById(
            "description"
        ).textContent =
            "Unable to load product details.";


        showImagePlaceholder(
            "Product image unavailable"
        );

    }

}


/* =====================================================
   BUTTON
   ===================================================== */

document.getElementById(
    "add-to-cart-btn"
).addEventListener(
    "click",
    addToCart
);


/* =====================================================
   START
   ===================================================== */

loadProduct();

</script>

{% endblock %}
